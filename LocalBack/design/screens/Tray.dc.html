<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tray flyout</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#0F5FBF}a:hover{color:#0B4A95}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 16px;border-radius:6px;font:inherit;font-size:14px;font-weight:600;line-height:1;text-decoration:none;cursor:pointer;box-sizing:border-box;white-space:nowrap;transition:background .12s,box-shadow .12s,transform .06s}
.btn:hover{text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid #0F5FBF;outline-offset:2px}
.btn-primary{color:#fff;border:1px solid rgba(0,0,0,.14);box-shadow:inset 0 -1px 0 rgba(0,0,0,.22),0 1px 2px rgba(0,0,0,.10)}
.btn-primary:hover{filter:brightness(.93)}
.btn-secondary{background:#fff;border:1px solid #D1D1D1;border-bottom-color:#B4B4B4;color:#1B1B1B;font-weight:500;box-shadow:0 1px 1px rgba(0,0,0,.04)}
.btn-secondary:hover{background:#F6F6F6}
.btn-outline{background:#fff;border:1px solid currentColor;font-weight:600}
.btn-outline:hover{background:#EEF4FC}
.btn-ghost{background:transparent;border:1px solid transparent;color:#1B1B1B;font-weight:500;padding:0 10px}
.btn-ghost:hover{background:#ECECEC}
.btn-sm{height:32px;padding:0 12px;font-size:13px}
.btn-icon{width:32px;height:32px;padding:0;color:#5C5C5C}
.caption{display:inline-flex;align-items:center;justify-content:center;width:46px;height:36px;border:none;background:transparent;color:#1B1B1B;cursor:pointer;padding:0}
.caption:hover{background:#E6E6E6}
.caption-close:hover{background:#C42B1C;color:#fff}
.nav-item{display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;border-radius:6px;color:#1B1B1B;text-decoration:none;font-weight:500}
.nav-item:hover{background:#ECECEC;color:#1B1B1B}
.nav-item-active{background:#E6EEF9;font-weight:600;box-shadow:inset 3px 0 0 #0F5FBF}
.nav-item-active:hover{background:#E6EEF9}
</style>
</helmet>
<div style="width: 360px; height: 440px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; padding: 18px; background: #FFFFFF; border: 1px solid #C8C8C8; border-radius: 10px; font-family: 'Segoe UI', system-ui, sans-serif; color: #1B1B1B; font-size: 14px">

  <div style="display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; align-items: center; gap: 8px; font-weight: 600">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="14" rx="2"></rect><path d="M7 20h10M12 8v6M9 11l3 3 3-3"></path></svg>
      LocalBack
    </div>
    <a href="Main.dc.html" class="btn btn-ghost btn-sm" style="color: #0F5FBF; font-weight: 600; margin-right: -10px">Open app<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M8 7h9v9"></path></svg></a>
  </div>

  <div style="display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 8px; background: #E3F1E8">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1F7A4D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M8 12l3 3 5-6"></path></svg>
    <div>
      <div style="font-weight: 600">Everything is backed up</div>
      <div style="font-size: 12px; color: #2E5A3F">Last run 14:32 · 3 sets · E: Samsung T7</div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <sc-for list="{{sets}}" as="s" hint-placeholder-count="3">
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 4px; border-bottom: 1px solid #EFEFEF">
        <div style="display: flex; align-items: center; gap: 10px">
          <span style="width: 8px; height: 8px; border-radius: 4px; background: {{s.dot}}"></span>
          <span>{{s.name}}</span>
        </div>
        <span style="font-size: 12px; color: #4A4A4A">{{s.when}}</span>
      </div>
    </sc-for>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
    <button type="button" class="btn btn-primary" style="height: 40px; background: {{accent}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M8 11l4 4 4-4"></path><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"></path></svg>Back up now</button>
    <div style="display: flex; gap: 8px">
      <a href="History.dc.html" class="btn btn-secondary" style="flex: 1">Restore…</a>
      <button type="button" class="btn btn-secondary" style="flex: 1">Pause 1 h</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0F5FBF","options":["#0F5FBF","#1F7A4D","#7A3E9D"]},"$preview":{"width":360,"height":440}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#0F5FBF',
      sets: [
        { name: 'Desktop', when: '14:32', dot: '#1F7A4D' },
        { name: 'Documents', when: '14:32', dot: '#1F7A4D' },
        { name: 'Projects', when: '3 pending', dot: '#B85C00' }
      ]
    };
  }
}
</script>
</body>
</html>
